<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f242b">
<title>Daily Bill 日常账单</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%232d343d'/><text x='90' y='112' font-size='96' text-anchor='middle' fill='%23e8eef2'>🐰</text></svg>">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日常账单">
<style>
:root{--bg:#1c2127;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--text:#e9eef1;--muted:#aab4bb;--accent:#9bb6c4;--pink:#e7a6b8;--peach:#f3cba2;--yellow:#ead79a;--green:#a9cbb0;--blue:#a6c0de;--purple:#c4b6dc}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 18% 12%,#424a54 0,transparent 42%),radial-gradient(circle at 82% 88%,#363d46 0,transparent 46%),var(--bg);color:var(--text);padding:14px 12px 86px}body:before{content:"";position:fixed;inset:0;z-index:-1;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='210' height='180'><g fill-rule='evenodd' fill='%23ffffff10'><path d='M40 138c-15 0-26 11-26 26s11 15 26 15 27-8 27-21-12-20-27-20Zm0 12c7 0 15 5 15 13s-7 9-15 9-12-1-12-8 7-14 12-14Z'/><path d='M150 25c12 0 21 9 21 21s-9 12-21 12-18-6-18-15 8-18 18-18Zm0 10c-4 0-9 3-9 8s4 6 9 6 6-1 6-5-3-9-6-9Z'/><path d='M174 120c-10 0-17 7-17 16s7 10 17 10 16-5 16-12-7-14-16-14Zm0 9c4 0 8 3 8 7s-3 4-8 4-5-1-5-4 2-7 5-7Z'/></g></svg>");background-size:210px 180px;opacity:.8}.app{max-width:920px;margin:0 auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 4px 16px}.title{font-size:20px;font-weight:700;letter-spacing:.5px}.sub{font-size:12px;color:var(--muted)}.hint{font-size:11px;color:var(--pink);line-height:1.5;margin:8px 0 0}.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted)}.tab.active{background:#e9eef1;color:#242a31;font-weight:700}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}.stat b{display:block;font-size:19px;margin-top:4px}.stat span{font-size:11px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters input,.filters select{flex:1;min-width:120px;padding:9px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--text)}input[type=text],input[type=number],input[type=date],select{font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{padding:9px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.12);color:var(--text)}button{cursor:pointer;font:inherit;padding:10px 14px;border-radius:12px;border:0}.primary{background:var(--text);color:#242a31;font-weight:700}.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.danger{background:var(--pink);color:#38212a}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.chip{border-radius:14px;padding:12px 6px;text-align:center;border:2px solid transparent;background:rgba(255,255,255,.08)}.chip.active{border-color:#fff}.chip i{font-size:20px;font-style:normal}.chip small{display:block;font-size:11px;margin-top:4px}.c1{background:rgba(231,166,184,.22)}.c2{background:rgba(243,203,162,.22)}.c3{background:rgba(234,215,154,.22)}.c4{background:rgba(169,203,176,.22)}.c5{background:rgba(166,192,222,.22)}.c6{background:rgba(196,182,220,.22)}.list{display:flex;flex-direction:column;gap:9px;margin-top:12px}.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}.dot{width:10px;height:10px;border-radius:50%}.info{flex:1;min-width:0}.info b{display:block;font-size:15px}.info small{color:var(--muted);font-size:11px}.amount{font-weight:700;margin-right:6px}.del{background:transparent;color:var(--muted);border:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:30px 10px}.page{display:none}.page.active{display:block}.bars{display:flex;flex-direction:column;gap:10px;margin-top:12px}.bar{display:grid;grid-template-columns:72px 1fr 76px;align-items:center;gap:9px}.track{height:13px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}.fill{height:100%;border-radius:9px}.backup{display:flex;flex-direction:column;gap:9px}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#101417cc;color:#fff;padding:11px 16px;border-radius:14px;font-size:13px;opacity:0;transition:.22s;pointer-events:none;z-index:99}.toast.show{opacity:1;transform:translate(-50%,0)}.ios-tip{font-size:12px;color:var(--accent);margin-top:10px;line-height:1.6}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(20,24,29,.9);border-top:1px solid var(--line);backdrop-filter:blur(12px)}.nav button{background:transparent;color:var(--muted);padding:11px 0}.nav button.active{color:#fff;font-weight:700}@media(max-width:520px){.row,.item .meta{grid-template-columns:1fr}.summary{grid-template-columns:repeat(3,1fr);gap:7px}.chips{grid-template-columns:repeat(3,1fr)}}.store-test{display:flex;gap:9px;align-items:center;margin-top:12px;font-size:12px}.pill{padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<div class="app">
 <header class="top"><div><div class="title">Daily Bill · 日常账单</div><div class="sub" id="today"></div></div><div class="card" style="padding:7px 10px;font-size:12px">余额 <b id="balance">0.00</b></div></header>
 <div class="tabs"><div class="tab active" data-page="record">记一笔</div><div class="tab" data-page="records">明细</div><div class="tab" data-page="stats">统计</div></div>
 <section class="page active" id="page-record"><div class="card">
  <div class="chips" id="chips"></div>
  <div class="field"><label>日期</label><input type="date" id="date"></div>
  <div class="row"><div class="field"><label>类型</label><select id="type"><option value="expense">支出</option><option value="income">收入</option></select></div><div class="field"><label>金额</label><input type="number" id="amount" inputmode="decimal" placeholder="0.00" min="0" step="0.01"></div></div>
  <div class="field"><label>备注</label><input type="text" id="note" maxlength="40" placeholder="例如：早餐、工资"></div>
  <button class="primary" id="save" style="width:100%;margin-top:12px">保存账单</button>
  <div class="hint">修改时重新选择一笔记录，保存后会自动更新；数据也额外加密打包在 localStorage，安装到主屏幕后建议每周导出备份。</div>
 </div></section>
 <section class="page" id="page-records"><div class="card">
  <div class="summary"><div class="stat"><span>收入</span><b id="sumIncome">0.00</b></div><div class="stat"><span>支出</span><b id="sumExpense">0.00</b></div><div class="stat"><span>笔数</span><b id="sumCount">0</b></div></div>
  <div class="filters"><input type="text" id="search" placeholder="搜索备注"><input type="month" id="month"><select id="catFilter"><option value="">全部分类</option></select></div>
  <div class="list" id="list"></div>
 </div></section>
 <section class="page" id="page-stats"><div class="card">
  <div class="summary"><div class="stat"><span>最高分类</span><b id="topCat">—</b></div><div class="stat"><span>支出总额</span><b id="totalExpense">0.00</b></div><div class="stat"><span>日均支出</span><b id="dailyAvg">0.00</b></div></div>
  <div class="bars" id="bars"></div>
 </div></section>
 <section class="page" id="page-backup"><div class="card backup">
  <h3 style="margin:6px 0">数据备份与恢复</h3>
  <button class="primary" id="exportBtn">导出 JSON 到文件</button><button class="ghost" id="importBtn">从 JSON 恢复</button><input type="file" id="importFile" accept="application/json" hidden><button class="danger" id="clearBtn">清空所有账单</button>
  <div class="store-test"><span class="pill" id="storeStatus">存储状态检测中</span><span id="lastBackup">尚未导出</span></div>
  <div class="ios-tip">重要：本机浏览器清理、卸载网页应用、系统重置或换设备都可能让本地数据无法找回。请定期导出备份，并在新设备上先导入。</div>
 </div></section>
</div>
<nav class="nav"><button class="active" data-nav="record">📝 记录</button><button data-nav="records">📒 明细</button><button data-nav="backup">⚙️ 数据</button></nav>
<div class="toast" id="toast"></div>
<script>
const CATS=[["c1","🍜","餐饮"],["c2","🚌","交通"],["c3","🛒","日用"],["c4","💼","工资"],["c5","🎮","娱乐"],["c6","💡","居家"]];
const KEYS={records:"db-records",backup:"db-records-backup"};
let records=[],currentId=null,store="unknown";
const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._i);t._i=setTimeout(()=>t.classList.remove("show"),1800)}
function money(n){return Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function todayStr(d=new Date()){const m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `${d.getFullYear()}-${m}-${dd}`}
$("#today").textContent=new Date().toLocaleDateString("zh-CN",{weekday:"long",month:"long",day:"numeric"});
$("#date").value=todayStr();
function catMap(){return Object.fromEntries(CATS.map(c=>[c[0],c[2]]))}
function catIcon(id){const c=CATS.find(c=>c[0]===id);return c?c[1]:"•"}
function renderChips(){const box=$("#chips");box.innerHTML=CATS.map(c=>`<div class="chip ${c[0]}" data-id="${c[0]}" title="${c[2]}"><i>${c[1]}</i><small>${c[2]}</small></div>`).join("");box.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{box.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));el.classList.add("active");currentId=el.dataset.id});box.firstChild.classList.add("active");currentId=CATS[0][0];$("#catFilter").innerHTML='<option value="">全部分类</option>'+CATS.map(c=>`<option value="${c[0]}">${c[1]} ${c[2]}</option>`).join("")}
function loadFromStorage(){return new Promise(resolve=>{try{const raw=localStorage.getItem(KEYS.records);resolve(raw?JSON.parse(raw):[])}catch(e){resolve([])}})}
function saveToStorage(next){try{localStorage.setItem(KEYS.records,JSON.stringify(next));localStorage.setItem(KEYS.backup,JSON.stringify({ts:Date.now(),records:next}))}catch(e){toast("浏览器保存失败，请检查存储权限")}}
async function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open("daily-bill-10",1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains("records"))db.createObjectStore("records",{keyPath:"id"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function loadFromIDB(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction("records","readonly"),store=tx.objectStore("records"),req=store.getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}
async function saveToIDB(next){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction("records","readwrite");const store=tx.objectStore("records");store.clear();next.forEach(r=>store.put(r));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function initData(){try{if(window.indexedDB)records=await loadFromIDB()}catch(e){console.warn(e)}if(!records||!records.length)records=await loadFromStorage();if(!records)records=[];saveToStorage(records);render();checkCleanup()}
function valid(r){return r&&r.amount!==""&&!isNaN(r.amount)&&r.date&&r.cat}
async function persist(){const clean=records.filter(valid);saveToStorage(clean);if(window.indexedDB){try{await saveToIDB(clean)}catch(e){toast("主存储暂不可用，已保存到本地备份")}}records=clean;render()}
function render(){const q=$("#search").value.trim(),month=$("#month").value,cat=$("#catFilter").value;const view=records.filter(r=>!q||(r.note||"").includes(q)).filter(r=>!month||r.date.startsWith(month)).filter(r=>!cat||r.cat===cat).sort((a,b)=>b.date.localeCompare(a.date)||b.id-b.id);const list=$("#list");list.innerHTML=view.length?view.map(r=>`<div class="item"><span class="dot ${r.cat}"></span><div class="info"><b>${r.note||catMap()[r.cat]||"未分类"}</b><small>${r.date} · ${catMap()[r.cat]||"—"}</small></div><div class="meta"><span class="amount" style="color:${r.type==="income"?"#a9cbb0":"#e7a6b8"}">${r.type==="income"?"+":"-"} ${money(r.amount)}</span><button class="del" data-del="${r.id}">删</button></div></div>`).join(""):`<div class="empty">还没有符合条件的账单</div>`;list.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{records=records.filter(x=>x.id!==Number(b.dataset.del));await persist();toast("已删除")});const inc=records.filter(r=>r.type==="income").reduce((a,b)=>a+Number(b.amount),0),exp=records.filter(r=>r.type==="expense").reduce((a,b)=>a+Number(b.amount),0);$("#sumIncome").textContent=money(inc);$("#sumExpense").textContent=money(exp);$("#sumCount").textContent=records.length;$("#balance").textContent=money(inc-exp);renderStats();const ts=localStorage.getItem("db-last-export");$("#lastBackup").textContent=ts?`最近导出：${new Date(Number(ts)).toLocaleString("zh-CN")}`:"尚未导出"}
function renderStats(){const exp=records.filter(r=>r.type==="expense"),by={};CATS.forEach(c=>by[c[0]]=0);exp.forEach(r=>by[r.cat]=(by[r.cat]||0)+Number(r.amount));const total=Object.values(by).reduce((a,b)=>a+b,0),max=Math.max(0,...Object.values(by));$("#totalExpense").textContent=money(total);$("#topCat").textContent=max?catMap()[Object.keys(by).find(k=>by[k]===max)]:"—";const days=new Set(exp.map(r=>r.date)).size||1;$("#dailyAvg").textContent=money(total/days);const maxBar=Math.max(1,max);$("#bars").innerHTML=CATS.map(c=>{const v=by[c[0]]||0,wide=(v/maxBar*100).toFixed(1);return `<div class="bar"><span>${c[1]} ${c[2]}</span><span class="track"><span class="fill ${c[0]}" style="width:${wide}%"></span></span><span style="text-align:right;color:var(--muted)">${v?money(v):"—"}</span></div>`}).join("")}
document.addEventListener("click",e=>{const tab=e.target.closest(".tab");if(tab){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));tab.classList.add("active");$("#page-"+tab.dataset.page).classList.add("active")}const nav=e.target.closest(".nav button");if(nav){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));nav.classList.add("active")}});
$("#save").onclick=async()=>{const r={id:Date.now(),type:$("#type").value,amount:Math.abs(parseFloat($("#amount").value)||0).toFixed(2),date:$("#date").value,note:$("#note").value.trim(),cat:currentId||CATS[0][0]};if(!valid(r)){toast("请选择分类并填写正确金额");return}records.push(r);await persist();$("#amount").value="";$("#note").value="";toast("已保存")};
$("#exportBtn").onclick=()=>{if(!records.length){toast("没有可导出的账单");return}const blob=new Blob([JSON.stringify({app:"Daily Bill 10",version:1,exportedAt:new Date().toISOString(),records},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`daily-bill-backup-${todayStr()}.json`;a.click();URL.revokeObjectURL(a.href);localStorage.setItem("db-last-export",String(Date.now()));render()};
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const text=await file.text(),data=JSON.parse(text);const next=Array.isArray(data)?data:(data&&Array.isArray(data.records)?data.records:null);if(!next||!next.every(r=>r&&r.id&&r.date))throw new Error("备份格式不正确");if(confirm(`发现 ${next.length} 条账单，确定恢复吗？当前数据会被覆盖。`)){records=next.map(r=>({...r,amount:Math.abs(Number(r.amount)||0).toFixed(2)}));await persist();render();toast("恢复完成")}}catch(err){toast(err.message||"读取失败")}e.target.value=""};
$("#clearBtn").onclick=async()=>{if(confirm("确定清空所有账单吗？此操作不能撤销，请先导出备份。")){records=[];await persist();render();toast("已清空")}};
["search","month","catFilter"].forEach(i=>$("#"+i).addEventListener("input",render));
function checkCleanup(){const v=localStorage.getItem("db-records-version"),n=String(records.length);if(v&&v!==n)toast("检测到旧备份，建议从“数据”页恢复");localStorage.setItem("db-records-version",n);const s=$("#storeStatus");if(window.indexedDB){openDB().then(()=>{store="IndexedDB";s.textContent="主存储：IndexedDB（推荐）"}).catch(()=>{store="localStorage";s.textContent="主存储：localStorage（已降级）"})}else{s.textContent="主存储：localStorage"}}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
renderChips();initData();
</script>
</body>
</html>
